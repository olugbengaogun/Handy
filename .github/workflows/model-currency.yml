name: Model currency check

# Handy Plus inherits its model catalog from cjpais/Handy via the daily upstream
# sync. Upstream maintains it aggressively, so this workflow deliberately does
# NOT regenerate the catalog — doing that would conflict on every sync. It only
# watches for a stall in the delivery chain and reports one consolidated issue.
#
# The most valuable check is the last one: the catalog is `include_str!`-baked
# into the binary, so models that are merged but not released are invisible to
# users. Merging diligently without shipping is the likeliest way this fork goes
# stale, and it is the link we control.

on:
  schedule:
    # Mondays, 07:00 UTC — early enough in the week to act on the result.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: model-currency
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the shipped-vs-merged check diffs the catalog
          # against the most recent release tag, and a shallow clone has neither.
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/cjpais/Handy.git || true
          git fetch upstream --quiet || echo "upstream fetch failed; that check will report it"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run currency check
        id: check
        run: |
          bun run scripts/check-model-currency.ts | tee report.txt
          # Findings are reported in the body, not by failing the job — a red X
          # every week trains people to ignore it.
          if grep -q "No drift detected" report.txt; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the drift issue
        if: steps.check.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const title = 'Model currency: drift detected';
            const body = [
              'The weekly model-currency check found drift in the model delivery chain.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              '<sub>Generated by `.github/workflows/model-currency.yml`. ',
              'Re-run it from the Actions tab after acting on the findings.</sub>',
            ].join('\n');

            // Reuse one issue rather than opening a new one every week.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'model-currency',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              core.info(`Updated issue #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['model-currency'],
              });
              core.info(`Opened issue #${created.data.number}`);
            }

      - name: Close the drift issue when everything is current
        if: steps.check.outputs.drift == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'model-currency',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Model stack is current again — closing automatically.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
