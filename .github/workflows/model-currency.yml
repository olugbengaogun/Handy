name: Model currency check

# Handy Plus inherits its model catalog from cjpais/Handy via the daily upstream
# sync. Upstream maintains it aggressively, so this workflow deliberately does
# NOT regenerate the catalog — doing that would conflict on every sync. It only
# watches for a stall in the delivery chain and reports one consolidated issue.
#
# The most valuable check is the last one: the catalog is `include_str!`-baked
# into the binary, so models that are merged but not released are invisible to
# users. Merging diligently without shipping is the likeliest way this fork goes
# stale, and it is the link we control.

on:
  schedule:
    # Mondays, 07:00 UTC — early enough in the week to act on the result.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Issues are disabled on this fork, so the report is delivered through the run
# summary and the job status rather than an issue. Nothing here needs write
# access to anything.
permissions:
  contents: read

concurrency:
  group: model-currency
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the shipped-vs-merged check diffs the catalog
          # against the most recent release tag, and a shallow clone has neither.
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/cjpais/Handy.git || true
          git fetch upstream --quiet || echo "upstream fetch failed; that check will report it"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run currency check
        id: check
        run: |
          bun run scripts/check-model-currency.ts | tee report.txt
          # The job status is decided by the reporting step below, so that the
          # report always reaches the run summary first.
          if grep -q "No drift detected" report.txt; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report findings
        if: always() && steps.check.outputs.drift != ''
        env:
          DRIFT: ${{ steps.check.outputs.drift }}
        run: |
          # This step used to open a GitHub issue. Issues are disabled on this
          # fork (contributors are pointed upstream), so github-script threw
          # "Issues has been disabled in this repository" and the job died
          # *after* a successful check — the findings were computed, then thrown
          # away. The first run that had anything to say was the first run to
          # fail, which is the worst possible failure mode for a watchdog.
          #
          # The report now goes to the run summary, and drift fails the job.
          # The original design deliberately did not fail, on the grounds that a
          # weekly red X trains people to ignore it. That reasoning holds for
          # alarms nobody can act on; it does not hold here. Every finding this
          # check emits is actionable — bump the crate, add the model, unstick
          # the sync — so the X stays red exactly until someone acts, which is
          # what a red X is for. With Issues gone it is also the only channel
          # left that sends mail.
          {
            echo "## Model currency check"
            echo
            if [ "$DRIFT" = "true" ]; then
              echo "Drift detected in the model delivery chain."
            else
              echo "No drift detected — the model stack is current."
            fi
            echo
            echo '```'
            # Tolerated rather than assumed: if the check crashed before writing
            # the report, a bare `cat` fails under `set -e` and takes the summary
            # down with it - losing the diagnosis of the very failure being
            # reported.
            cat report.txt 2>/dev/null || echo "(the check produced no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRIFT" = "true" ]; then
            echo "::error::Model currency drift detected. See the run summary for the full report."
            exit 1
          fi
