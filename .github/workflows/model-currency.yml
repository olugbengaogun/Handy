name: Model currency check

# Handy Plus inherits its model catalog from cjpais/Handy via the daily upstream
# sync. Upstream maintains it aggressively, so this workflow deliberately does
# NOT regenerate the catalog — doing that would conflict on every sync. It only
# watches for a stall in the delivery chain and reports one consolidated issue.
#
# The most valuable check is the last one: the catalog is `include_str!`-baked
# into the binary, so models that are merged but not released are invisible to
# users. Merging diligently without shipping is the likeliest way this fork goes
# stale, and it is the link we control.

on:
  schedule:
    # Mondays, 07:00 UTC — early enough in the week to act on the result.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Issues are disabled on this fork, so the report is delivered through the run
# summary and the job status rather than an issue. Nothing here needs write
# access to anything.
permissions:
  contents: read

concurrency:
  group: model-currency
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the shipped-vs-merged check diffs the catalog
          # against the most recent release tag, and a shallow clone has neither.
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/cjpais/Handy.git || true
          git fetch upstream --quiet || echo "upstream fetch failed; that check will report it"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run currency check
        id: check
        run: |
          # The job status is decided by the reporting step below, so that the
          # report always reaches the run summary first.
          #
          # The status now comes from the script's exit code rather than from
          # grepping its prose through `tee`. That pipeline returned `tee`'s
          # status, and GitHub's shell is `bash -e` with no `pipefail`, so a
          # crash in the check exited 0 and was then reported as drift — the
          # one failure whose real name matters most, given the wrong one. The
          # old gate also keyed on an English sentence, so rewording a line
          # would have silently inverted it.
          #
          #   0 = clean, 2 = actionable drift, anything else = the check broke.
          set +e
          bun run scripts/check-model-currency.ts > report.txt 2>&1
          code=$?
          set -e
          # The output is recorded before anything else can fail. If `cat` were
          # first and report.txt were missing, `bash -e` would abort this step
          # with no `code` set, the reporting step's guard would skip it, and
          # the run would go red carrying no summary at all — a silent alarm.
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat report.txt 2>/dev/null || echo "(the check produced no output)"

      - name: Report findings
        if: always() && steps.check.outputs.code != ''
        env:
          CODE: ${{ steps.check.outputs.code }}
        run: |
          # This step used to open a GitHub issue. Issues are disabled on this
          # fork (contributors are pointed upstream), so github-script threw
          # "Issues has been disabled in this repository" and the job died
          # *after* a successful check — the findings were computed, then thrown
          # away. The first run that had anything to say was the first run to
          # fail, which is the worst possible failure mode for a watchdog.
          #
          # The report now goes to the run summary, and drift fails the job.
          # The original design deliberately did not fail, on the grounds that a
          # weekly red X trains people to ignore it. That reasoning holds for
          # alarms nobody can act on; it does not hold here. With Issues gone
          # the job status is also the only channel left that sends mail.
          #
          # "Every finding this check emits is actionable" was the premise, and
          # it was not true: the script has always graded findings `info` or
          # `warn`, and this gate ignored the grade. An absent release tag and
          # an unreachable upstream — both written to be informational — failed
          # the job exactly like real drift. Only `warn` does now, which is what
          # the grade was for. A finding nobody here can act on still prints; it
          # just does not cost a red X.
          {
            echo "## Model currency check"
            echo
            case "$CODE" in
              0) echo "No actionable drift — the model stack is current." ;;
              2) echo "Drift detected in the model delivery chain." ;;
              *) echo "The check did not complete (exit $CODE); the output below is the diagnosis." ;;
            esac
            echo
            echo '```'
            # Tolerated rather than assumed: if the check crashed before writing
            # the report, a bare `cat` fails under `set -e` and takes the summary
            # down with it - losing the diagnosis of the very failure being
            # reported.
            cat report.txt 2>/dev/null || echo "(the check produced no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # A broken check and a stalled model stack are both worth mail, but
          # they are not the same problem and must not arrive wearing the same
          # name — the whole point of keeping the exit code intact.
          case "$CODE" in
            0) ;;
            2)
              echo "::error::Model currency drift detected. See the run summary for the full report."
              exit 1
              ;;
            *)
              echo "::error::The model currency check itself failed (exit $CODE). See the run summary."
              exit 1
              ;;
          esac
