name: "code quality"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/src/catalog/catalog.json"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/src/catalog/catalog.json"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation consistency
        # Advisory in this fork. Handy Plus adds its own English strings and
        # does not translate them, so this has failed permanently - and because
        # it aborted the job, ESLint and Prettier below never ran at all. A
        # cosmetic gap was hiding the checks that catch real defects.
        # i18next falls back to English for missing keys, so nothing is broken
        # for users; the report still prints, it just no longer fails the run.
        continue-on-error: true
        run: bun run check:translations

      - name: Check model language coverage
        run: bun run check:model-languages

      # There is no unit-test runner in this repo: every `*.test.ts` is a plain
      # script that asserts and exits non-zero. Nothing ran them, so they were
      # decorative - portableInstaller.test.ts had been sitting there green by
      # assumption. They are this fork's only mechanical guard on two things
      # that fail silently: an i18n override drifting away from the upstream
      # string it rebrands, and the sync resolver deciding a conflict a human
      # should have seen.
      #
      # Every test runs even after one fails, because "the first failure" is
      # rarely the whole picture when a locale file has moved underneath them.
      - name: Run standalone tests
        run: |
          status=0
          for t in $(git ls-files '*.test.ts'); do
            echo "::group::$t"
            bun "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier
        run: bun run format:check
