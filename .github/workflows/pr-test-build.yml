name: "PR Test Build"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build"
        required: true
        type: string

jobs:
  build-test:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Handy Plus ships Apple Silicon Mac only (see release.yml and
          # main-build.yml), so a PR test build is that one target. Upstream's
          # other six entries (Intel Mac, three Linux, two Windows) built
          # artifacts nobody installs; restore them from this file's git
          # history if the fork ever ships those platforms again.
          - platform: "macos-26" # for Arm based macs (M1 and above). Uses macOS 26 for Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      # This fork has no paid Apple/Azure signing certificates. Match release
      # and main-branch builds so PR validation reaches compilation instead of
      # failing while importing secrets that intentionally do not exist.
      sign-binaries: false
      asset-prefix: "handy-pr-${{ inputs.pr_number }}"
      upload-artifacts: true
      is-debug-build: ${{ contains(matrix.args, '--debug') }}
      ref: ${{ format('refs/pull/{0}/merge', inputs.pr_number) }}
    secrets: inherit

  comment-on-pr:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post artifact links to PR
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: `## 🧪 Test Build Ready\n\nBuild artifacts for PR #${{ inputs.pr_number }} are available for testing.\n\n**[Download artifacts from workflow run](${runUrl})**\n\nArtifacts expire after 30 days.`
            });
