name: "Sync upstream (cjpais/Handy)"

# Keeps this fork's main branch up to date with the original Handy project
# with as little human involvement as possible, without ever silently
# clobbering this fork's customizations (rebrand, instant-mute fix,
# audio-free history, personal dictionary, usage insights, etc.):
#
#   - No new upstream commits           -> do nothing.
#   - Merges cleanly AND tests pass     -> push straight to main. Zero clicks.
#   - Merge conflict OR tests fail      -> push a branch and open a PR instead
#                                          of touching main, so a human looks
#                                          at exactly what collided.
#
# This intentionally does NOT use a generic "sync fork" action — those reset/
# fast-forward a branch to match upstream, which would destroy the commits
# that make this fork worth having in the first place.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC — matches CJ's near-daily commit pace
  workflow_dispatch:

# Two of these running at once would race each other's merge, version bump and
# push - and the loser would bump a version that the winner had already taken.
# Queue rather than cancel: a half-finished sync should be allowed to land.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Dispatching the release workflow. Issues are disabled on this fork, so
  # every notification here goes to the run summary and the job status instead.
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          # GitHub refuses any push from the built-in GITHUB_TOKEN that
          # touches .github/workflows/ — a platform rule with no permission
          # flag to unlock it. Upstream edits its own CI often enough
          # (838f8a2 "feat(nix): add Cachix binary cache" killed the
          # 2026-08-05 sync) that the whole sync dies on those days. SYNC_PAT
          # is a fine-grained PAT with Workflows: read/write. The fallback
          # keeps this working exactly as before if the secret is absent —
          # every sync that does not carry a workflow-file change still
          # lands.
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "handy-plus-sync-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Fetch upstream and attempt merge
        id: merge
        run: |
          # Recorded before merging so the generated release notes can list
          # exactly what this sync brought in.
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          git remote add upstream https://github.com/cjpais/Handy.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "No new upstream commits."
            echo "status=nothing_to_do" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Upstream bumps its own version on every release, and this fork now
          # bumps the same line on every automatic release - so CJ shipping
          # anything collides here. Left alone that would stop the automation
          # roughly every time he releases, which is precisely what it exists
          # to avoid, and for a line whose resolution is never in doubt: this
          # fork's numbering is deliberately decoupled, so ours always wins.
          #
          # Strictly scoped. Every conflicting line, in every conflicting
          # file, must be a bare version declaration. One line of anything
          # else and this refuses and the conflict goes to a human, because a
          # merge nobody read is only acceptable when there is nothing to read.
          resolve_version_only_conflict() {
            local f
            for f in $(git diff --name-only --diff-filter=U); do
              awk '
                function keyof(line,   s) {
                  s = line
                  sub(/^[[:space:]]+/, "", s)
                  if (s ~ /^"/) { sub(/^"/, "", s); sub(/".*$/, "", s); return s }
                  sub(/[[:space:]]*=.*$/, "", s)
                  return s
                }
                function allowed(k) {
                  return k == "version" || k == "productName" || k == "identifier" ||
                         k == "description" || k == "authors" || k == "name"
                }
                /^<<<<<<< / { side = 1; delete ours; delete theirs; no = 0; nt = 0; next }
                /^=======$/ { if (side) { side = 2; next } }
                /^>>>>>>> / {
                  if (side) {
                    # Same keys on both sides, all of them fork identity, or
                    # this is not a collision anyone can resolve unread.
                    if (no != nt) bad = 1
                    for (k in ours) if (!(k in theirs)) bad = 1
                    for (k in theirs) if (!(k in ours)) bad = 1
                    side = 0
                    next
                  }
                }
                side == 1 { k = keyof($0); if (k == "" || !allowed(k)) bad = 1; else { ours[k] = 1; no++ } ; next }
                side == 2 { k = keyof($0); if (k == "" || !allowed(k)) bad = 1; else { theirs[k] = 1; nt++ } ; next }
                END { exit bad ? 1 : 0 }
              ' "$f" || return 1
            done

            # Keep our side of each conflict block while leaving the rest of
            # the file as git merged it - `git checkout --ours` would throw
            # away upstream's other, non-conflicting edits to the same file.
            for f in $(git diff --name-only --diff-filter=U); do
              awk '
                /^<<<<<<< / { side = 1; next }
                /^=======$/ { if (side) { side = 2; next } }
                /^>>>>>>> / { if (side) { side = 0; next } }
                side == 2   { next }
                            { print }
              ' "$f" > "$f.resolved" && mv "$f.resolved" "$f"
              git add "$f"
            done
            git commit --no-edit
          }

          if git merge upstream/main --no-edit; then
            echo "Merged cleanly, running tests before pushing."
            echo "status=merged" >> "$GITHUB_OUTPUT"
          elif resolve_version_only_conflict; then
            echo "Only the version line collided - kept this fork's version."
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            echo "Merge conflict — leaving conflict markers for review."
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        if: steps.merge.outputs.status == 'merged'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libvulkan-dev glslc spirv-headers

      - name: Rust cache
        if: steps.merge.outputs.status == 'merged'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Bun
        if: steps.merge.outputs.status == 'merged'
        uses: oven-sh/setup-bun@v2

      - name: Run test suite on the merged result
        if: steps.merge.outputs.status == 'merged'
        id: test
        run: |
          bun install

          # `cargo test` cannot see TypeScript, so without this an upstream
          # change that breaks the UI build would merge clean, pass the gate,
          # and land on main - only surfacing whenever someone next cut a
          # release. Runs first because it fails in seconds where cargo takes
          # minutes. A failure here is not a step failure: it sets pass=false
          # so the PR path below opens a branch for review, same as a failing
          # cargo test.
          if ! bun run build; then
            echo "Frontend build failed on the merged result."
            echo "pass=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (cd src-tauri && cargo test); then
            echo "pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "pass=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version, write notes, push, and release
        if: steps.merge.outputs.status == 'merged' && steps.test.outputs.pass == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          BEFORE: ${{ steps.merge.outputs.before }}
        run: |
          set -euo pipefail

          # Circuit breaker, checked BEFORE anything is bumped or pushed. If
          # the last two release runs ended badly, a third identical attempt
          # will not help - so stop here, while main is still untouched.
          #
          # Order matters more than it looks: bumping first would leave main
          # collecting a version bump and an orphan release-notes file every
          # day the breaker stayed tripped, for versions that were never built
          # or released. Whenever it was eventually fixed, only the newest
          # version would ship and every skipped one would vanish silently.
          #
          # Deliberately stateless: it reads run history rather than keeping a
          # counter, so a single manual green release re-arms it. Only runs
          # that actually concluded are considered, so one queued or hung run
          # cannot sit at the front of the list and mask two real failures
          # behind it. Restricted to main so a test dispatch from a branch
          # cannot skew the streak either way.
          CONCLUDED=$(gh run list --workflow release.yml --repo "$GITHUB_REPOSITORY" \
            --branch main --limit 10 --json conclusion \
            --jq '[.[] | select(.conclusion != null and .conclusion != "")][0:2]')
          SEEN=$(jq 'length' <<< "$CONCLUDED")
          BAD=$(jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length' <<< "$CONCLUDED")

          if [ "$SEEN" -ge 2 ] && [ "$BAD" -ge 2 ]; then
            echo "The last two release runs did not succeed - halting before touching main."
            # This used to open an issue. Issues are disabled on this fork, so
            # `gh issue list` failed, and under `set -e` a failing command
            # substitution in an assignment kills the step - the breaker
            # reported "Issues has been disabled in this repository" instead of
            # "auto-release halted", i.e. the diagnostic was about the
            # messenger. The summary plus a failed job says it without needing
            # a feature this repo does not have, and failing is the honest
            # status: the sync deliberately did not do its job this run.
            {
              echo "## Auto-release halted after repeated failures"
              echo
              echo "The two most recent Release runs did not succeed, so the daily sync has"
              echo "stopped releasing. Upstream changes are still being merged and tested, but"
              echo "this run stopped before bumping the version, so no half-finished releases"
              echo "pile up on \`main\` while this is broken."
              echo
              echo "To resume: fix whatever broke and run the Release workflow manually once."
              echo "A single successful run re-arms the automation on its own."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Auto-release halted: the last two Release runs failed. See the run summary."
            exit 1
          fi

          # Each release needs its own tag, and the tag comes from the version
          # in tauri.conf.json - so shipping upstream changes automatically
          # means bumping automatically. Patch only: minor and major stay
          # deliberate, so this fork's numbering still means something rather
          # than just counting CJ's commits.
          CURRENT=$(jq -r '.version' src-tauri/tauri.conf.json)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Version $CURRENT -> $NEW"

          # Targeted line edits rather than a JSON/TOML rewriter on purpose:
          # reformatting these files would collide with upstream on every
          # future merge. Anchored to the two-space top-level indent so a
          # nested "version" key added later can never be hit by accident.
          sed -i "s/^  \"version\": \"$CURRENT\",\$/  \"version\": \"$NEW\",/" src-tauri/tauri.conf.json
          sed -i "s/^  \"version\": \"$CURRENT\",\$/  \"version\": \"$NEW\",/" package.json
          sed -i "0,/^version = \"$CURRENT\"\$/s//version = \"$NEW\"/" src-tauri/Cargo.toml
          sed -i "/^name = \"handy\"\$/{n;s/^version = \".*\"\$/version = \"$NEW\"/}" src-tauri/Cargo.lock

          # Assert the exact field, not merely that the string turns up
          # somewhere in the file. A partial bump is the one failure that
          # produces a fully green, successfully published, wrong release.
          read_toml_version() {
            awk '/^\[package\]/ { inpkg = 1; next }
                 /^\[/ { inpkg = 0 }
                 inpkg && /^version = / { gsub(/[" ]/, ""); sub(/^version=/, ""); print; exit }' "$1"
          }
          read_lock_version() {
            awk '/^name = "handy"$/ { getline; gsub(/[" ]/, ""); sub(/^version=/, ""); print; exit }' "$1"
          }

          [ "$(jq -r '.version' src-tauri/tauri.conf.json)" = "$NEW" ] \
            || { echo "tauri.conf.json version is not $NEW" >&2; exit 1; }
          [ "$(jq -r '.version' package.json)" = "$NEW" ] \
            || { echo "package.json version is not $NEW" >&2; exit 1; }
          [ "$(read_toml_version src-tauri/Cargo.toml)" = "$NEW" ] \
            || { echo "Cargo.toml [package] version is not $NEW" >&2; exit 1; }
          [ "$(read_lock_version src-tauri/Cargo.lock)" = "$NEW" ] \
            || { echo "Cargo.lock handy version is not $NEW" >&2; exit 1; }

          # Release notes, unless someone has already written better ones by
          # hand. Machine notes are a changelog rather than prose, which is
          # exactly why an existing file always wins.
          # Everything since the last release, not just what this merge pulled
          # in: work the owner pushed himself between syncs is already on main
          # before the merge, so a merge-scoped range would list CJ's changes
          # and silently omit his own. Falls back to the merge range only if
          # the previous tag is missing (first release after this landed).
          NOTES="src/content/release-notes/$NEW.md"
          if [ ! -f "$NOTES" ]; then
            if git rev-parse -q --verify "refs/tags/v$CURRENT" > /dev/null; then
              RANGE="v$CURRENT..HEAD"
            else
              echo "No tag v$CURRENT - falling back to this sync's merge range."
              RANGE="$BEFORE..HEAD"
            fi
            # These notes are shipped inside the app: releaseNotes.ts bundles
            # this directory with import.meta.glob and the What's New dialog
            # shows it on first launch after an update. So it is read by
            # users, not developers, and a commit subject is the wrong unit
            # of text entirely - "move blocking cpal work off the main
            # thread + lock-free is_recording" is accurate, useful to CJ, and
            # meaningless to someone who just wanted dictation.
            #
            # No regex turns developer shorthand into prose, so this does not
            # try. Every word that reaches a user comes from the fixed table
            # below; commit subjects are only ever *matched* against it,
            # never echoed. That is what makes gibberish structurally
            # impossible here rather than merely unlikely. When a release
            # deserves real prose, write the file by hand and the block above
            # leaves it alone.
            SUBJECTS=$(git log --no-merges --pretty='%s' "$RANGE" || true)

            # Housekeeping and other-platform work, dropped before anything
            # is counted. This fork publishes exactly one target - see the
            # single-entry matrix in release.yml - so a Windows registry fix
            # is noise to every single person who will read this. Default is
            # to keep: a line only goes if it clearly matches, because an
            # omitted fix is a worse failure than an untidy one.
            RELEVANT=$(printf '%s\n' "$SUBJECTS" \
              | grep -Ev '^(ci|chore|docs|test|build|style|refactor)(\([^)]*\))?!?: ' \
              | grep -Ev '^[a-z]+\((nix|ci|deps|release|workflow)\)!?: ' \
              | grep -Eiv '^(pr|issue) template' \
              | awk '/[Ww]indows|[Ll]inux|[Ww]ayland|AppImage/ &&
                     !/[Mm]ac|[Dd]arwin|[Aa]pple|[Cc]ore[Aa]udio/ { next }
                     { print }' \
              || true)

            # Conventional-commit scope -> plain English. Anything not on
            # this list is silently ignored, so an unrecognised scope can
            # never leak a raw token like "nix" into the dialog.
            AREAS=$(printf '%s\n' "$RELEVANT" \
              | sed -nE 's/^[a-z]+\(([a-z0-9_-]+)\)!?:.*/\1/p' \
              | sort -u \
              | while read -r scope; do
                  case "$scope" in
                    audio|recorder|mic|microphone|vad) echo "Audio recording" ;;
                    overlay)                           echo "The recording overlay" ;;
                    transcription|whisper|parakeet|model|models) echo "Transcription" ;;
                    history)                           echo "History" ;;
                    settings|ui|onboarding|i18n)       echo "The interface" ;;
                    paste|clipboard|output)            echo "Pasting text" ;;
                    shortcut|shortcuts|hotkey)         echo "Keyboard shortcuts" ;;
                    llm|post-process|postprocess)      echo "Post-processing" ;;
                    updater|update)                    echo "Updates" ;;
                  esac
                done | sort -u || true)

            # "Maintenance update" is a claim, and it is false the moment
            # upstream ships an actual feature - so it is only made when the
            # commits back it up.
            if printf '%s\n' "$RELEVANT" | grep -qE '^feat(\([^)]*\))?!?: '; then
              LEAD="This update brings new improvements from the upstream Handy project into Handy Plus."
            else
              LEAD="This is a maintenance update, bringing the latest fixes from the upstream Handy project into Handy Plus."
            fi

            {
              echo "## What's new in $NEW"
              echo
              echo "$LEAD"
              if [ -n "$AREAS" ]; then
                echo
                echo "Areas improved in this release:"
                echo
                printf '%s\n' "$AREAS" | sed 's/^/- /'
              fi
            } > "$NOTES"
            echo "Wrote $NOTES from $RANGE"
          fi

          # Named files rather than `git add -A`: this runs after `bun install`
          # and `cargo test`, both of which can rewrite tracked lockfiles, and
          # an unattended release commit should contain the release and
          # nothing it happened to find lying around.
          git add \
            src-tauri/tauri.conf.json \
            package.json \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            "$NOTES"
          # The skip-ci marker keeps CI behaving as it did before this job
          # started pushing with a PAT. Pushes made with the built-in
          # GITHUB_TOKEN never trigger `on: push` workflows; PAT pushes do -
          # so without it every sync would fire main-build, code-quality and
          # test on top of the release build dispatched two lines below,
          # building the same commit twice, daily, for no added signal. This
          # job has already run `bun run build` and `cargo test` on the merged
          # tree, and release.yml rebuilds the shipping target immediately.
          # Only push-triggered runs are skipped; the workflow_dispatch below
          # is unaffected, and the PR path deliberately omits the marker so a
          # sync that needs human review still gets full CI.
          git commit -m "chore: release v$NEW (automated upstream sync) [skip ci]"
          git push origin HEAD:main

          # --ref must be a branch or tag name; the API rejects a raw SHA, so
          # this resolves main as it stands immediately after the push above.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish=true
          echo "Dispatched release v$NEW."

      - name: Push a branch and open a PR for review
        if: steps.merge.outputs.status == 'conflict' || (steps.merge.outputs.status == 'merged' && steps.test.outputs.pass == 'false')
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          REASON="merge conflict"
          # Referenced further down on both paths, so it must exist on both.
          WORKFLOW_CONFLICTS=""
          if [ "${{ steps.merge.outputs.status }}" == "merged" ]; then
            REASON="tests failed after merging cleanly"
            # git merge --no-edit already auto-committed the merge itself on
            # success; there is nothing new to stage here. Committing again
            # would fail ("nothing to commit") and abort this step before the
            # PR is ever opened.
          else
            # A conflicted merge leaves markers unstaged with no commit yet —
            # stage and commit them so the PR shows exactly what collided.
            #
            # Except in .github/workflows/. A conflict marker is not valid YAML,
            # and GitHub parses every workflow file on push regardless of its
            # triggers: on 2026-08-07 the markers left in build.yml produced a
            # second failure mail ("No jobs were run") for a file that has no
            # push trigger at all, about a collision the first mail had already
            # reported. One conflict, two alarms, one of them meaningless.
            #
            # So workflow files keep *our* version on the branch - the fork's CI
            # is deliberately trimmed to one target and is the side that almost
            # always wins anyway - and upstream's version is parked beside it
            # under a name GitHub will not try to parse. Nothing is hidden: the
            # PR body lists every file this happened to, and the .upstream copy
            # is right there to diff against.
            for f in $(git diff --name-only --diff-filter=U -- .github/workflows); do
              # Stage 3 is "theirs". A file upstream *deleted* has no stage 3, so
              # this is allowed to come up empty rather than abort the step.
              if git show ":3:$f" > "${f}.upstream" 2>/dev/null; then
                git add "${f}.upstream"
                NOTE="- \`$f\` (upstream's version saved as \`${f}.upstream\`)"
              else
                rm -f "${f}.upstream"
                NOTE="- \`$f\` (upstream has no version of this file)"
              fi
              WORKFLOW_CONFLICTS="$(printf '%s%s\n' "$WORKFLOW_CONFLICTS" "$NOTE")"
              git checkout --ours -- "$f"
              git add "$f"
            done

            git add -A
            git commit -m "chore: upstream sync (has conflicts, needs review)"
          fi

          # A conflict that is already waiting must not be duplicated.
          #
          # This matters *because* of the --repo fix above. While `gh pr create`
          # was silently failing, the daily re-push was invisible - it left one
          # more orphan branch and nothing else, which is how 13 of them
          # accumulated unnoticed. Now that PRs genuinely open, the very same
          # loop would file one PR per day for one unresolved collision.
          #
          # Same invariant the stale-conflict-branch job relies on: a
          # `sync-upstream-*` branch exists only while the collision is
          # unresolved, because resolving one means merging it and deleting the
          # branch. So if a branch is already sitting there, this run has
          # nothing new to say - and re-pushing over it is not an option
          # either, since a human may be resolving it right now.
          if ! REMOTE_SYNC_BRANCHES=$(git ls-remote --heads origin "sync-upstream-*"); then
            echo "::error::Could not list remote branches; refusing to guess whether a conflict is already waiting."
            exit 1
          fi
          EXISTING_BRANCH=$(printf '%s\n' "$REMOTE_SYNC_BRANCHES" \
            | awk '{ sub("refs/heads/", "", $2); print $2 }' | sort | tail -1)

          if [ -n "$EXISTING_BRANCH" ]; then
            {
              echo "### Upstream sync still blocked"
              echo
              echo "Reason: **$REASON**"
              echo
              echo "\`$EXISTING_BRANCH\` is already waiting to be resolved, so this run did"
              echo "not open a second branch or a second PR. \`main\` is untouched."
              echo
              echo "Resolve that branch, merge it, then delete it - the next sync picks up"
              echo "everything that has landed upstream since."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Unresolved sync branch $EXISTING_BRANCH already exists; not creating another."
            exit 0
          fi

          BRANCH="sync-upstream-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

          # The push above is the part that matters: the collision is now
          # preserved on a branch where a human can resolve it, and main was
          # never touched. Opening the PR is a *notification*, so it must not be
          # able to fail the job.
          #
          # On 2026-08-07 it did. `gh pr create` was targeting the wrong
          # repository (see --repo below), returned "Resource not accessible by
          # personal access token", and the step exited non-zero - reporting the
          # whole sync as failed even though it had done its job perfectly.
          # Worse, the failure arrived as an alarm about the safety net rather
          # than a prompt to resolve the conflict, which is the opposite of what
          # this is for.
          BODY="Automatic sync from cjpais/Handy couldn't merge and test cleanly ($REASON). Review and resolve here before merging into \`main\`."
          # printf rather than a multi-line string literal: every line inside a
          # `run: |` block must stay indented past the block's margin, and a
          # continuation starting at column 0 silently ends the scalar and
          # corrupts the workflow - which is the exact class of breakage the
          # workflow-file handling above exists to prevent.
          if [ -n "$WORKFLOW_CONFLICTS" ]; then
            BODY="$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
              "$BODY" \
              "**Workflow files were left at this fork's version** so the branch stays" \
              "valid YAML (a conflict marker under \`.github/workflows/\` makes GitHub" \
              "report a phantom failed run). Upstream's side is parked beside each one:" \
              "$WORKFLOW_CONFLICTS")"
          fi

          # --repo is load-bearing, not decoration. This job adds an `upstream`
          # remote pointing at cjpais/Handy (see the merge step), and a bare
          # `gh pr create` resolves its target from the remotes — it picks
          # `upstream` over `origin`. So for a year this tried to open the PR on
          # **CJ's repository**, where SYNC_PAT has no access and never should:
          #
          #     Resource not accessible by personal access token (createPullRequest)
          #
          # which reads exactly like a missing permission and was diagnosed as
          # one twice. The token had `pull requests: read and write` the whole
          # time. Every other gh call here already passed --repo; this was the
          # one that did not. Note the failure was doing us a favour: with
          # access, this would have published the fork's conflict branch as a
          # proposed contribution to upstream.
          if ! gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Upstream sync needs a look ($REASON)" \
            --body "$BODY" \
            --base main --head "$BRANCH"; then
            {
              echo "### Upstream sync needs a look"
              echo
              echo "Reason: **$REASON**"
              echo
              echo "The branch \`$BRANCH\` was pushed successfully, but the PR"
              echo "could not be opened automatically - most likely SYNC_PAT is"
              echo "missing the **Pull requests: read and write** permission."
              echo
              echo "Open it by hand:"
              echo "https://github.com/${GITHUB_REPOSITORY}/pull/new/$BRANCH"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Branch $BRANCH pushed, but the PR could not be opened. See the run summary."
          fi

  # The alarm that was missing. On 2026-08-14 the merge started conflicting, so
  # every run pushed a `sync-upstream-*` branch and tried to open a PR against
  # the wrong repo, so `gh pr create` failed — deliberately only
  # a ::warning:: and a run-summary note, because a failed *notification* must
  # not report the sync itself as broken (see the comment on that step). The
  # result was thirteen consecutive green runs while main sat 30 commits behind
  # upstream and the model catalog quietly went stale. Nobody was told, because
  # nothing had "failed".
  #
  # This job watches the condition itself rather than any one delivery channel:
  # an unresolved conflict branch that nobody has dealt with. Resolving a sync
  # means merging it and deleting the branch, so a `sync-upstream-*` branch that
  # has outlived the grace period IS the unresolved state, whether the PR was
  # opened, never opened, or opened and ignored. It needs no token and no API —
  # the timestamp is in the branch name.
  #
  # Separate job, not a step: the sync must still run and report its own status
  # honestly even while an older conflict is outstanding.
  stale-conflict-branch:
    runs-on: ubuntu-24.04
    needs: sync
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fail while an unresolved sync branch is outstanding
        env:
          # Two days: long enough that a conflict pushed overnight is not an
          # alarm before anyone could reasonably have looked at it, short
          # enough that the backlog never reaches the size this one did.
          GRACE_HOURS: "48"
        run: |
          NOW=$(date -u +%s)
          STALE=""
          COUNT=0

          # Fetched up front rather than straight into the loop: a process
          # substitution that fails leaves the loop reading nothing, and the job
          # would report "all clear" because the network broke — the exact
          # false-green this job exists to abolish.
          if ! BRANCHES=$(git ls-remote --heads origin "sync-upstream-*"); then
            echo "::error::Could not list remote branches; cannot tell whether a sync is unresolved."
            exit 1
          fi

          # Branch names are `sync-upstream-YYYYMMDD-HHMMSS`, always UTC.
          while read -r _sha ref; do
            # A here-string over empty output still yields one empty line.
            # Spelled out as an `if`: under `set -e`, a bare `[ ... ] && cmd`
            # whose test fails is a statement returning 1, which is exactly the
            # shape that bites people in CI.
            if [ -z "$ref" ]; then
              continue
            fi
            BRANCH="${ref#refs/heads/}"
            COUNT=$((COUNT + 1))
            STAMP="${BRANCH#sync-upstream-}"
            # `date -d` needs separators; a malformed name must not be silently
            # skipped, nor treated as infinitely old without saying so.
            ISO="${STAMP:0:4}-${STAMP:4:2}-${STAMP:6:2} ${STAMP:9:2}:${STAMP:11:2}:${STAMP:13:2}"
            if ! WHEN=$(date -u -d "$ISO" +%s 2>/dev/null); then
              echo "::warning::Could not read a date out of branch $BRANCH; treating it as stale."
              STALE="$STALE\n- \`$BRANCH\` (unparseable timestamp)"
              continue
            fi
            AGE_H=$(( (NOW - WHEN) / 3600 ))
            if [ "$AGE_H" -ge "$GRACE_HOURS" ]; then
              STALE="$STALE\n- \`$BRANCH\` — ${AGE_H}h old"
            fi
          done <<< "$BRANCHES"

          if [ -z "$STALE" ]; then
            echo "No unresolved sync branches past the grace period ($COUNT present)."
            exit 0
          fi

          {
            echo "## Unresolved upstream sync"
            echo
            echo "A conflict branch has been waiting longer than ${GRACE_HOURS}h."
            echo "While it sits there, \`main\` falls further behind cjpais/Handy and the"
            echo "model catalog goes stale — the daily sync cannot merge past a conflict."
            echo
            printf '%b\n' "$STALE"
            echo
            echo "Resolve the newest one, merge it into \`main\`, then delete the branches."
            echo "This job goes green once no \`sync-upstream-*\` branches remain."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::An upstream sync conflict has been unresolved for over ${GRACE_HOURS}h. See the run summary."
          exit 1
