name: "Release"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish automatically once the assets verify. Off = draft, as before."
        required: false
        default: false
        type: boolean

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Tags are needed by the version guard below; the default shallow
          # checkout has none, which would make every release look like the first.
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Refuse to cut a release that is not newer than what is already published.
      #
      # This fork's version number is not chosen by hand alone: the daily
      # upstream sync bumps it whenever CJ publishes his own release. So a
      # working copy that has not been pulled recently will show a version that
      # is already behind what shipped, and a release cut from it would either
      # collide with an existing tag or quietly ship users a build older than
      # the one they are running. Comparing against the real tag list is the
      # only source of truth; a person's memory of "what version are we on" is
      # not, and that is precisely the mistake this guard exists to make
      # impossible.
      - name: Verify version is newer than the latest release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.get-version.outputs.version }}"

          if [ -z "$VERSION" ]; then
            echo "::error::Could not read a version from src-tauri/tauri.conf.json"
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Bump the version before releasing."
            exit 1
          fi

          # Highest existing vX.Y.Z tag, ignoring anything non-numeric.
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n1)

          if [ -z "$LATEST" ]; then
            echo "No previous release tags found; treating v$VERSION as the first."
            exit 0
          fi

          echo "Latest published: v$LATEST"
          echo "About to release:  v$VERSION"

          # `sort -V | tail -1` picks the higher of the two. If that is the
          # already-published one, this release would be a downgrade.
          HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)
          if [ "$HIGHEST" != "$VERSION" ]; then
            echo "::error::v$VERSION is not newer than the published v$LATEST."
            echo "::error::Pull the latest main (the upstream sync may have bumped the version) and pick a higher number."
            exit 1
          fi

          echo "Version check passed."

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # This fork only ships Apple Silicon macOS builds for now - it's
          # built for personal use on the maintainer's own hardware, and
          # building every platform on every release was taking too long.
          # Windows x64 support is paused, not removed: re-add the
          # "windows-latest" / "x86_64-pc-windows-msvc" entry below (see
          # this file's git history) once there's actual demand for it.
          # Anyone needing Intel Mac, Windows, or Linux builds today should
          # get the original, actively cross-platform-maintained Handy from
          # cjpais/Handy instead.
          - platform: "macos-26" # for Arm based macs (M1 and above). Uses macOS 26 for Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      # No Apple Developer / Azure Trusted Signing certs for this fork (both
      # are paid). Auto-updates still work fine without OS code-signing —
      # that's a separate, free mechanism (see build.yml). Flip to true if
      # you ever set up paid certs; first-run installs will just show an
      # "unidentified developer" prompt until then (one-time, per machine).
      sign-binaries: false
      asset-prefix: "handy"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  # Publishing is what actually ships to users: the Tauri updater reads
  # /releases/latest, and a draft is invisible to it. So this is deliberately
  # a separate job that `needs` every build, which means GitHub skips it for
  # free if anything upstream failed - a broken build can never publish.
  #
  # It also closes the window where a release is public but incomplete. The
  # assets arrive in stages (tauri-action, then the stable-name dmg), and a
  # published release whose latest.json points at a missing or truncated
  # archive is worse than no release at all: the updater would find an update
  # on every launch and fail to install it, forever. Everything is therefore
  # verified against the API before the draft flag comes off, and the flip is
  # the very last thing that happens.
  verify-and-publish:
    if: ${{ inputs.publish }}
    needs: [create-release, publish-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Verify the release, then publish it
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.create-release.outputs.version }}"
          EXPECTED_VERSION: "${{ needs.create-release.outputs.version }}"
        run: |
          set -euo pipefail

          fail() { echo "REFUSING TO PUBLISH $TAG: $1" >&2; exit 1; }

          # Read the truth from the API rather than trusting what this run
          # believes it uploaded.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > release.json
          echo "Assets attached to $TAG:"
          jq -r '.assets[] | "  \(.name)  \(.size) bytes"' release.json

          # The updater's manifest and the archive it points at.
          TARBALL=$(jq -r '[.assets[].name | select(endswith(".app.tar.gz"))][0] // ""' release.json)
          [ -n "$TARBALL" ] || fail "no .app.tar.gz - there is nothing for the updater to install"
          jq -e --arg n "${TARBALL}.sig" 'any(.assets[]; .name == $n)' release.json > /dev/null \
            || fail "$TARBALL has no .sig - the updater rejects unsigned archives"
          jq -e 'any(.assets[]; .name == "latest.json")' release.json > /dev/null \
            || fail "no latest.json - the updater would never see this release"
          jq -e 'any(.assets[]; .name == "HandyPlus.dmg")' release.json > /dev/null \
            || fail "no stable-name HandyPlus.dmg"

          # A truncated upload is the failure that matters most, because it
          # still looks like a valid release from the outside.
          while read -r name size; do
            [ "$size" -ge 5000000 ] || fail "$name is only $size bytes - truncated upload"
          done < <(jq -r '.assets[]
            | select((.name | endswith(".dmg")) or (.name | endswith(".app.tar.gz")))
            | "\(.name) \(.size)"' release.json)

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir . --clobber
          jq -e . latest.json > /dev/null || fail "latest.json is not valid JSON"

          MANIFEST_VERSION=$(jq -r '.version // ""' latest.json)
          [ "$MANIFEST_VERSION" = "$EXPECTED_VERSION" ] \
            || fail "latest.json says '$MANIFEST_VERSION' but this release is '$EXPECTED_VERSION' - a stale build was published under a new version"

          # Directly guards the partial-upload race: every file the manifest
          # promises must actually be attached.
          while read -r url; do
            asset=$(basename "$url")
            jq -e --arg n "$asset" 'any(.assets[]; .name == $n)' release.json > /dev/null \
              || fail "latest.json points at '$asset', which is not attached to the release"
          done < <(jq -r '.platforms[].url' latest.json)

          echo "All checks passed - publishing $TAG."
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
