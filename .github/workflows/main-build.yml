name: "Main Branch Build"

# Runs the full cross-platform build on every push to main so breakage is
# caught before a manual release is triggered. Artifacts are kept for 30 days
# so any commit on main has a downloadable, testable build.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # One entry, deliberately, and it is the one release.yml publishes.
        # Upstream builds seven platforms here because upstream ships seven;
        # this fork ships a single Apple Silicon build, so the other six could
        # only ever produce a red X and a failure email for something nobody
        # can install - noise about a platform that is not this fork's
        # product. The macOS leg still does the real work this file exists
        # for: catching a packaging break on main before a release is cut.
        #
        # This is the block upstream edits when CJ adds or drops a platform,
        # so expect an occasional conflict here on sync. Resolution is always
        # the same: keep this fork's single entry. Restoring full coverage
        # means copying his list back, and is only worth doing if this fork
        # ever publishes more than one target.
        include:
          - platform: "macos-26"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      upload-artifacts: true
      # False in this fork, which has no paid Apple or Azure certificates -
      # asking for them made both macOS jobs fail on every push to main, for a
      # certificate that was never going to be there. False is also what
      # release.yml passes, so CI now builds the same way releases do, and the
      # macOS jobs pick up the stable self-signed identity (see build.yml).
      sign-binaries: false
    secrets: inherit
